name: Android (TWA)

# Manual only: a Play upload is a deliberate act, and the signing key is a
# repository secret that should not be exercised on every push.
on:
  workflow_dispatch:
    inputs:
      target_sdk:
        description: "Android target SDK level to force on the generated project"
        required: false
        default: "35"
      build_number:
        description: "Build counter appended to the version code (0-99)"
        required: false
        default: "0"

permissions:
  contents: read

env:
  BUBBLEWRAP_VERSION: "1.25.0"

jobs:
  build:
    name: Bubblewrap build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Sync the TWA version with package.json
        run: bun run android:version -- --build "${{ inputs.build_number }}"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot sign the bundle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
          echo "Keystore restored ($(stat -c%s android/keystore.jks) bytes)"

      - name: Install Bubblewrap
        run: bun add --global @bubblewrap/cli@${{ env.BUBBLEWRAP_VERSION }}

      - name: Generate the Android project
        working-directory: android
        env:
          # Bubblewrap otherwise prompts for a JDK/SDK location.
          BUBBLEWRAP_JDK_PATH: ${{ env.JAVA_HOME }}
          BUBBLEWRAP_ANDROID_SDK_PATH: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          bubblewrap init \
            --manifest ../android/twa-manifest.json \
            --directory . \
            --skipPwaValidation

      # Bubblewrap pins the target SDK of its own release; Play enforces a
      # floor that moves every year, so rewrite it before building.
      - name: Force the target SDK
        env:
          ANDROID_PROJECT_DIR: android
        run: bun run android:target-sdk -- "${{ inputs.target_sdk }}"

      - name: Build the app bundle and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath ./keystore.jks \
            --signingKeyAlias devanilayam

      - name: Verify the signature
        working-directory: android
        run: |
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose app-release-signed.apk

      - uses: actions/upload-artifact@v7
        with:
          name: devanilayam-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 14

      # Runs even when an earlier step failed, so the key never survives the job.
      - name: Delete the keystore
        if: always()
        run: rm -f android/keystore.jks
