name: Feature request
description: Suggest something the site should be able to do.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is difficult or impossible today? Describe the need, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Content (slokas, ashtotaras, stotras, blogs)
        - Reading experience
        - Audio
        - Languages and scripts
        - Search and navigation
        - Offline / installable app
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
