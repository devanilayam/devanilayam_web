version: 2

updates:
  # Weekly on Saturday morning IST (03:30 UTC), so a broken bump is found on a
  # day when nothing is shipping.
  #
  # `bun`, not `npm`: the npm updater only knows package-lock/yarn/pnpm
  # lockfiles, so it bumped package.json and left bun.lock behind, and every
  # PR then died on CI's `bun install --frozen-lockfile`.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    reviewers:
      - moulibheemaneti
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    ignore:
      # The preset's 10.x line needs conventional-changelog-writer@9, but the
      # semantic-release plugins still load writer@8, so Release dies with
      # "Missing helper". CI never runs Release, so a bump passes the PR checks
      # and only breaks main. Lift this once release-notes-generator moves on.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    groups:
      # Nuxt and its first-party modules move together; splitting them into
      # separate PRs just produces peer-dependency conflicts.
      nuxt-ecosystem:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "@nuxtjs/*"
          - "nuxt-*"
          - "vue"
          - "vue-router"
          - "@vue/*"
      linting-tools:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "stylelint"
          - "stylelint-*"
          - "@stylistic/*"
          - "typescript"
          - "vue-tsc"
      testing-tools:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "happy-dom"
          - "sass-true"
          - "sass"
          - "sass-embedded"
      release-tools:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:30"
      timezone: Asia/Kolkata
    labels:
      - dependencies
      - ci
    reviewers:
      - moulibheemaneti
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
